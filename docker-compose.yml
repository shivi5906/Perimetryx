services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perimetryx
      POSTGRES_USER: perimetryx
      POSTGRES_PASSWORD: perimetryx_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perimetryx -d perimetryx"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

